<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ZOR Cipher</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }

    .container {
      display: flex;
      gap: 20px;
    }

    .box {
      width: 50%;
    }

    textarea {
      width: 100%;
      height: 120px;
    }

    .output {
      margin-top: 10px;
      white-space: pre-wrap;
      background: #f4f4f4;
      padding: 10px;
      min-height: 60px;
    }
  </style>
</head>

<body>

<h2>ZOR Cipher (Encrypt + Decrypt)</h2>

<div class="container">

  <!-- LEFT: ENCRYPT -->
  <div class="box">
    <h3>Encrypt</h3>
    <textarea id="encryptInput"></textarea>
    <br><br>
    <button onclick="encrypt()">Encrypt</button>
    <div class="output" id="encryptOutput"></div>
  </div>

  <!-- RIGHT: DECRYPT -->
  <div class="box">
    <h3>Decrypt</h3>
    <textarea id="decryptInput"></textarea>
    <br><br>
    <button onclick="decrypt()">Decrypt</button>
    <div class="output" id="decryptOutput"></div>
  </div>

</div>

<script>

// =====================
// SPECIAL WORDS
// =====================
const special = {
  "the": "ZoR",
  "and": "NeX",
  "is": "VaC",
  "are": "SoL",
  "you": "KeM",
  "to": "RiN"
};

// reverse special words
const reverseSpecial = {
  "ZoR": "the",
  "NeX": "and",
  "VaC": "is",
  "SoL": "are",
  "KeM": "you",
  "RiN": "to"
};

// =====================
// LETTER CIPHER
// =====================
const cipher = {
  a:"e", b:"p", c:"k", d:"t", e:"o", f:"v", g:"d", h:"m", i:"a", j:"y",
  k:"c", l:"r", m:"n", n:"l", o:"u", p:"b", q:"w", r:"s", s:"h",
  t:"g", u:"i", v:"f", w:"z", x:"j", y:"q", z:"x"
};

// reverse letter cipher
let reverseCipher = {};
for (let key in cipher) {
  reverseCipher[cipher[key]] = key;
}

// =====================
// ENCRYPT
// =====================
function encryptWord(word) {
  let clean = word.toLowerCase().replace(/[^a-z]/g, "");

  if (special[clean]) return special[clean];

  let out = "";
  for (let c of word.toLowerCase()) {
    out += cipher[c] || c;
  }
  return out;
}

function encrypt() {
  let text = document.getElementById("encryptInput").value;
  let words = text.trim().split(/\s+/);
  let result = [];

  let sentenceStart = true;

  for (let word of words) {
    if (!word) continue;

    let clean = word.toLowerCase().replace(/[^a-z]/g, "");
    let enc = encryptWord(word);

    let isSpecial = !!special[clean];

    if (!isSpecial) {
      if (sentenceStart) {
        enc = enc.charAt(0).toUpperCase() + enc.slice(1);
        sentenceStart = false;
      }

      if (/[.!?]$/.test(word)) {
        sentenceStart = true;
      }
    }

    result.push(enc);
  }

  document.getElementById("encryptOutput").innerText = result.join(" ");
}

// =====================
// DECRYPT (STRICT)
// =====================
function decryptWord(word) {
  if (reverseSpecial[word]) return reverseSpecial[word];

  let out = "";
  for (let c of word.toLowerCase()) {
    out += reverseCipher[c] || c;
  }
  return out;
}

function decrypt() {
  let text = document.getElementById("decryptInput").value;
  let words = text.trim().split(/\s+/);
  let result = [];

  for (let word of words) {
    if (!word) continue;

    result.push(decryptWord(word));
  }

  document.getElementById("decryptOutput").innerText = result.join(" ");
}

// ENTER KEY SUPPORT (Encrypt + Decrypt)

document.getElementById("encryptInput").addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    encrypt();
  }
});

document.getElementById("decryptInput").addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    decrypt();
  }
});

</script>

</body>
</html>
